    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 30px;
      margin: 0;
    }

    .container {
      max-width: 650px;
      margin: auto;
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      text-align: center;
      color: #333;
      font-weight: 600;
      margin-bottom: 10px;
    }

    #timer {
      font-size: 16px;
      text-align: right;
      color: #ff4d4d;
      margin-bottom: 20px;
      font-weight: bold;
    }

    #quiz-box p {
      font-size: 18px;
      margin-bottom: 15px;
    }

    label {
      display: block;
      background: #f3f4f6;
      padding: 12px 18px;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }

    label:hover {
      background: #e0e7ff;
    }

    input[type="radio"] {
      margin-right: 10px;
    }

    #next-btn {
      display: block;
      background-color: #4f46e5;
      color: white;
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 30px auto 0 auto;
      transition: background-color 0.3s;
    }

    #next-btn:hover {
      background-color: #4338ca;
    }

    #result {
      text-align: center;
      font-size: 22px;
      color: #10b981;
      font-weight: bold;
      margin-top: 30px;
    }

    .hidden {
      display: none;
    }

    #next-btn:disabled {
  background-color: #ccc;
  cursor: not-allowed;
}

  </style>
</head>

    let currentQuestion = 0;
    let score = 0;
    let timeLeft = 15 * 60;

    const timerDisplay = document.getElementById('timer');
    const quizBox = document.getElementById('quiz-box');
    const nextBtn = document.getElementById('next-btn');
    const resultBox = document.getElementById('result');

    function startTimer() {
      const interval = setInterval(() => {
        const min = Math.floor(timeLeft / 60);
        const sec = timeLeft % 60;
        timerDisplay.textContent = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        timeLeft--;

        if (timeLeft < 0) {
          clearInterval(interval);
          finishQuiz();
        }
      }, 1000);
    }

    function loadQuestion(index) {
      const q = questions[index];
      quizBox.innerHTML = `
        <p><strong>Q${index + 1}: ${q.question}</strong></p>
        ${q.options
          .map(
            (opt, i) =>
              `<label><input type="radio" name="option" value="${i}" /> ${opt}</label>`
          )
          .join("")}
      `;
    }

   function finishQuiz() {
  quizBox.classList.add('hidden');
  nextBtn.classList.add('hidden');
  resultBox.classList.remove('hidden');

  resultBox.innerHTML = `
    <h2>Quiz Completed!</h2>
    <p><strong>Correct Answers:</strong> ${score}</p>
    <p><strong>Total Questions:</strong> ${questions.length}</p>
    <p><strong>Your Score:</strong> ${((score / questions.length) * 100).toFixed(2)}%</p>
  `;
}


    function handleNext() {
      const selected = document.querySelector('input[name="option"]:checked');
      if (selected) {
        const selectedIndex = parseInt(selected.value);
        if (selectedIndex === parseInt(questions[currentQuestion].answerHash)) {
          score++;
        }
      }

      currentQuestion++;

      if (currentQuestion < questions.length) {
        loadQuestion(currentQuestion);
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
  quizBox.classList.add('hidden');
  nextBtn.classList.add('hidden');
  resultBox.classList.remove('hidden');

  resultBox.innerHTML = `
    <h2>Quiz Completed!</h2>
    <p><strong>Correct Answers:</strong> ${score}</p>
    <p><strong>Total Questions:</strong> ${questions.length}</p>
    <p><strong>Your Score:</strong> ${((score / questions.length) * 100).toFixed(2)}%</p>
  `;

  // Send result to PHP using fetch
  const registerId = localStorage.getItem("register_id"); // assuming you saved it on login/register
  fetch('save_result.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      register_id: registerId,
      score: score,
      total_questions: questions.length
    })
  })
  .then(res => res.text())
  .then(data => console.log('Result Saved:', data))
  .catch(err => console.error('Error:', err));
}



function loadQuestion(index) {
  const q = questions[index];
  quizBox.innerHTML = `
    <p><strong>Q${index + 1}: ${q.question}</strong></p>
    ${q.options
      .map(
        (opt, i) =>
          `<label><input type="radio" name="option" value="${i}" /> ${opt}</label>`
      )
      .join("")}
  `;
  nextBtn.disabled = true; // Disable next until selection

  // Add event listener to radio buttons to enable button on selection
  const options = document.getElementsByName("option");
  options.forEach(opt => {
    opt.addEventListener("change", () => {
      nextBtn.disabled = false;
    });
  });
}

    nextBtn.addEventListener('click', handleNext);

    window.onload = () => {
      loadQuestion(currentQuestion);
      startTimer();
    };
